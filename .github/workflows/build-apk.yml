name: Build RiffLab APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate project (unzips automatically if you uploaded the .zip)
        id: locate
        run: |
          set -e
          if [ -z "$(find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' | head -1)" ]; then
            for z in $(find . -maxdepth 2 -name '*.zip' -not -path './.git/*'); do
              echo "Unzipping $z"
              unzip -oq "$z" -d _unzipped
            done
          fi
          SETTINGS=$(find . -maxdepth 4 -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle.kts found. Upload the project files or the source .zip to the repository root."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RiffLab-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
